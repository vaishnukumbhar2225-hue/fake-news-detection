<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detection</title>

    <style>

        body{
            background: linear-gradient(to right,#141e30,#243b55);
            font-family: Arial;
            color:white;
            text-align:center;
            padding-top:50px;
        }

        .container{
            width:60%;
            margin:auto;
            background:white;
            color:black;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.5);
        }

        textarea{
            width:90%;
            height:200px;
            padding:10px;
            font-size:18px;
            border-radius:10px;
        }

        button{
            background:#007BFF;
            color:white;
            border:none;
            padding:15px 30px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        h1{
            margin-bottom:30px;
        }

        h2{
            margin-top:20px;
            color:red;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Fake News Detection</h1>

        <form action="/predict" method="post">

            <textarea
            name="news"
            placeholder="Enter News Here"></textarea>

            <br><br>

            <button type="submit">
                Check News
            </button>

        </form>

        <h2>{{ prediction_text }}</h2>

    </div>

</body>
</html>
